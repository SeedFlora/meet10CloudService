# URL yang dicek blackbox exporter. Simpan file ini, Prometheus membacanya ulang dalam 30 detik.
- targets: ["http://model-api:8000/health"]
  labels:
    app: model-api
    lokasi: lokal

# Contoh website di internet. GANTI dengan URL deploy kelompokmu, misalnya
#   https://<user>-<space>.hf.space        (Hugging Face Space)
#   https://<project>.vercel.app/api/ready (Next.js Lab 08 di Vercel)
- targets: ["https://huggingface.co"]
  labels:
    app: huggingface-hub
    lokasi: web

